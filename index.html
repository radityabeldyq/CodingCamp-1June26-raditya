<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Life Dashboard — productivity dashboard personal dengan greeting, timer Pomodoro, to-do list, dan quick links." />
  <title>Life Dashboard</title>

  <!-- Anti-FOUC: terapkan tema tersimpan sebelum CSS di-render -->
  <script>
    (function () {
      var saved = localStorage.getItem('ld_theme');
      var theme = (saved === 'dark' || saved === 'light') ? saved : 'light';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===================== HEADER ===================== -->
  <header class="app-header" role="banner">
    <div class="header-inner">
      <span class="app-logo" aria-hidden="true">📋</span>
      <h1 class="app-title">Life Dashboard</h1>

      <!-- Theme Toggle (Tantangan 1) -->
      <button
        id="theme-toggle"
        class="btn btn-icon"
        type="button"
        aria-label="Ganti tema tampilan"
        title="Toggle Light / Dark Mode"
      >
        <span id="theme-icon" aria-hidden="true">🌙</span>
        <span id="theme-label" class="sr-only">Mode Gelap</span>
      </button>
    </div>
  </header>

  <!-- ===================== MAIN ===================== -->
  <main class="dashboard-grid" id="main-content" role="main">

    <!-- -------- WIDGET: Greeting -------- -->
    <section
      id="greeting-section"
      class="widget widget--greeting"
      aria-labelledby="greeting-heading"
    >
      <h2 id="greeting-heading" class="sr-only">Greeting & Waktu</h2>

      <div class="greeting-clock" aria-live="polite" aria-atomic="true">
        <time id="greeting-time" class="greeting-time" aria-label="Waktu sekarang">00:00</time>
        <p id="greeting-date" class="greeting-date" aria-label="Tanggal sekarang">—</p>
      </div>

      <p id="greeting-message" class="greeting-message" aria-live="polite">Selamat Datang</p>

      <!-- Custom Name input (Tantangan 2) -->
      <div class="greeting-name-form" role="group" aria-label="Atur nama sapaan">
        <label for="name-input" class="label">Nama kamu:</label>
        <div class="input-row">
          <input
            type="text"
            id="name-input"
            class="input"
            placeholder="Masukkan namamu…"
            maxlength="50"
            aria-describedby="name-hint"
            autocomplete="off"
          />
          <button
            id="name-save-btn"
            class="btn btn-primary"
            type="button"
            aria-label="Simpan nama"
          >
            Simpan
          </button>
        </div>
        <p id="name-hint" class="hint">Kosongkan untuk menghapus nama.</p>
      </div>
    </section>

    <!-- -------- WIDGET: Focus Timer -------- -->
    <section
      id="timer-section"
      class="widget widget--timer"
      aria-labelledby="timer-heading"
    >
      <h2 id="timer-heading" class="widget-title">Focus Timer</h2>

      <div class="timer-display-wrapper" role="timer" aria-live="polite" aria-atomic="true">
        <output id="timer-display" class="timer-display" for="timer-start timer-stop timer-reset">
          25:00
        </output>
      </div>

      <p
        id="timer-completion-msg"
        class="timer-completion-msg"
        role="status"
        aria-live="polite"
        hidden
      >
        🎉 Sesi fokus selesai! Istirahatlah sejenak.
      </p>

      <div class="timer-controls" role="group" aria-label="Kontrol timer">
        <button id="timer-start" class="btn btn-primary" type="button" aria-label="Mulai timer">
          ▶ Start
        </button>
        <button id="timer-stop" class="btn btn-secondary" type="button" aria-label="Hentikan timer" disabled>
          ⏸ Stop
        </button>
        <button id="timer-reset" class="btn btn-ghost" type="button" aria-label="Reset timer">
          ↺ Reset
        </button>
      </div>
    </section>

    <!-- -------- WIDGET: To-Do Manager -------- -->
    <section
      id="todo-section"
      class="widget widget--todo"
      aria-labelledby="todo-heading"
    >
      <h2 id="todo-heading" class="widget-title">To-Do List</h2>

      <!-- Add Task form -->
      <form id="todo-form" class="todo-form" aria-label="Tambah tugas baru" novalidate>
        <div class="input-row">
          <input
            type="text"
            id="todo-input"
            class="input"
            placeholder="Tugas baru…"
            maxlength="200"
            aria-label="Teks tugas baru"
            aria-describedby="todo-error"
            autocomplete="off"
            required
          />
          <button
            id="todo-add-btn"
            class="btn btn-primary"
            type="submit"
            aria-label="Tambah tugas"
          >
            + Tambah
          </button>
        </div>
        <p id="todo-error" class="error-msg" role="alert" aria-live="polite" hidden></p>
      </form>

      <!-- Sort controls (Tantangan 5) -->
      <div class="todo-sort" role="group" aria-label="Urutkan daftar tugas">
        <label for="sort-select" class="label">Urutkan:</label>
        <select
          id="sort-select"
          class="select"
          aria-label="Pilih mode pengurutan tugas"
        >
          <option value="default">Default (Urutan Tambah)</option>
          <option value="az">Sort A-Z</option>
          <option value="za">Sort Z-A</option>
          <option value="status">Status (Belum Selesai Dulu)</option>
        </select>
      </div>

      <!-- Task list -->
      <ul
        id="todo-list"
        class="todo-list"
        role="list"
        aria-label="Daftar tugas"
        aria-live="polite"
      >
        <!-- Task items di-render oleh TodoManager.render() -->
      </ul>
    </section>

    <!-- -------- WIDGET: Quick Links -------- -->
    <section
      id="links-section"
      class="widget widget--links"
      aria-labelledby="links-heading"
    >
      <h2 id="links-heading" class="widget-title">Quick Links</h2>

      <!-- Add Link form -->
      <form id="links-form" class="links-form" aria-label="Tambah tautan baru" novalidate>
        <div class="input-row">
          <input
            type="text"
            id="link-label-input"
            class="input"
            placeholder="Label (cth: GitHub)"
            maxlength="100"
            aria-label="Label tautan"
            aria-describedby="link-error"
            autocomplete="off"
            required
          />
          <input
            type="url"
            id="link-url-input"
            class="input"
            placeholder="https://…"
            maxlength="2048"
            aria-label="URL tautan"
            aria-describedby="link-error"
            autocomplete="off"
            required
          />
          <button
            id="link-add-btn"
            class="btn btn-primary"
            type="submit"
            aria-label="Tambah tautan"
          >
            + Tambah
          </button>
        </div>
        <p id="link-error" class="error-msg" role="alert" aria-live="polite" hidden></p>
      </form>

      <!-- Links list -->
      <ul
        id="links-list"
        class="links-list"
        role="list"
        aria-label="Daftar tautan favorit"
        aria-live="polite"
      >
        <!-- Link items di-render oleh QuickLinks.render() -->
      </ul>
    </section>

  </main>

  <!-- ===================== FOOTER ===================== -->
  <footer class="app-footer" role="contentinfo">
    <p>Life Dashboard © 2026 — Dibangun dengan HTML, CSS & Vanilla JS</p>
  </footer>

  <script defer src="js/app.js"></script>
</body>
</html>
